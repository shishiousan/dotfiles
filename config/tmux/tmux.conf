set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set-environment -g COLORTERM "truecolor"

## Mouse enable
set -g mouse on

## windows indexing
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


## My kemaps

### Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g prefix2 C-Space
bind C-Space send-prefix

### Reload config file

bind r source ~/.config/tmux/tmux.conf

### Toggle the status bar

bind h set status

### Windows related

bind < previous-window
bind > next-window
bind -n S-left previous-window
bind -n S-right next-window

### Popup related
bind-key -n M-1 run-shell '~/.config/tmux/scripts/popuptmux1.sh'
bind-key -n M-2 run-shell '~/.config/tmux/scripts/popuptmux2.sh'
bind-key -n M-3 run-shell '~/.config/tmux/scripts/popuptmux3.sh'
bind-key -n M-4 run-shell '~/.config/tmux/scripts/popuptmux4.sh'
bind-key -n M-d run-shell '~/.config/tmux/scripts/openTheDocs.sh'
bind-key -n M-b run-shell '~/.config/tmux/scripts/openTheBase.sh'
bind-key -n M-c run-shell '~/.config/tmux/scripts/openTheClasses.sh'
# bind-key -n M-s run-shell '~/.config/tmux/scripts/searchReplace.sh'
bind-key -n M-B run-shell '~/.config/tmux/scripts/buildBase.sh'
bind-key -n M-C run-shell '~/.config/tmux/scripts/buildClasses.sh'

### Session related
unbind l
bind-key -n M-l switch-client -l

### Pane related

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind Enter split-window -h -c "#{pane_current_path}"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

# decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
# bind-key -T copy-mode-vi 'C-\' select-pane -l
# bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

## This plugin is a repackaging of Mislav Marohnić's tmux-navigator configuration 
## described in this gist. When combined with a set of tmux key bindings, 
## the plugin will allow you to navigate seamlessly between vim and tmux splits 
## using a consistent set of hotkeys.
## https://github.com/christoomey/vim-tmux-navigator

## ls keybindings
set -g @plugin 'eylles/tmux-lskeys'

# set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'sainnhe/tmux-fzf'

bind-key -n "M-s" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

