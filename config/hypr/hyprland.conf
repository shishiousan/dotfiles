
# #######################################################################################
# ARCHER-PENGUIN HYPR CONFIG.
# #######################################################################################

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#
# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,auto
monitor=HDMI-A-2, 1920x1080, 0x0, 1
monitor=DP-1, 1920x1080, 1920x0, 1

workspace = 1,monitor:HDMI-A-2 
workspace = 2,monitor:HDMI-A-2 
workspace = 3,monitor:HDMI-A-2 
workspace = 4,monitor:HDMI-A-2 
workspace = 5,monitor:HDMI-A-2 
workspace = 6,monitor:DP-1 
workspace = 7,monitor:DP-1 
workspace = 8,monitor:DP-1 
workspace = 9,monitor:DP-1 
workspace = 10,monitor:DP-1 

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf 

# Set programs that you use
$waybarConf = $HOME/.config/hypr/waybar/config.ini
$waybarSty = $HOME/.config/hypr/waybar/style.css
$onedrivepath = $HOME/.config/autostart/onedrivegui.desktop
exec-once = waybar -c $waybarConf -s $waybarSty
exec-once = hyprpaper
exec-once = dropbox
exec-once = swaync 
exec-once = fcitx5 
exec-once = gio launch $onedrivepath

# Some default env vars.
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that
env = HYPRSHOT_DIR, $HOME/Pictures

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = jp
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 2
    gaps_out = 4
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default, slidevert
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    # new_is_master = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = false
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.
windowrulev2 = forceinput, class:.* # You'll probably like this.

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER
$wofisty = $HOME/.config/wofi_theme/src/macchiato/style.css

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
# bind = $mainMod, Q, exec, kitty
bind = $mainMod, RETURN, exec, alacritty
# bind = $mainMod, C, killactive,
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, X, exec, wlogout
bind = $mainMod, E, exec, nautilus
# bind = $mainMod, V, togglefloating,
bind = $mainMod, T, togglefloating,
bind = $mainMod, F, fullscreen
#bind = $mainMod, F12, exec, wofi --show drun
bind = $mainMod CTRL, RETURN, exec, rofi -show drun
bind = $mainMod,  F12, exec, wofi --style $wofisty --show drun --allow-images
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, SPACE, togglesplit, # dwindle
bind = $mainMod, W, exec, firefox

# Move focus with mainMod + arrow keys
bind = $mainMod, L, movefocus, r
bind = $mainMod, H, movefocus, l
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, up, workspace, -1
bind = $mainMod, left, workspace, 1
bind = $mainMod, right, workspace, +1
bind = $mainMod, down, workspace, +1
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind =,XF86MonBrightnessUp, exec, brightnessctl set +5% 
bind =,XF86MonBrightnessDown, exec, brightnessctl set 5%- 
# following commands locate in /home/shion/.local/bin/
bind =,XF86AudioRaiseVolume, exec, volume_up
bind =,XF86AudioLowerVolume, exec, volume_down 
bind =,XF86AudioMute, exec, mute_toggle 
# if above command do not work please check the number by 
# `pactl list sinks short`

bind = , F12, exec, xfce4-terminal --drop-down 

# playerctl
bind = CTRL SHIFT, right, exec, playerctl next   
bind = CTRL SHIFT, left, exec, playerctl previous
bind = CTRL SHIFT, down, exec, playerctl play-pause

bind = CTRL ALT, S, exec, spotify-launcher

# capture a window 
bind = $mainMod, PRINT, exec, hyprshot -m window
# capture a monitor 
bind = , PRINT, exec, hyprshot -m output
# capture a region 
bind = SHIFT, PRINT, exec, hyprshot -m region

# toggle of waybar 
bind = $mainModmod, O, exec, killall -SIGUSR1 waybar 

# Special workspces
bind = $mainMod ALT, S, movetoworkspacesilent, special
bind = $mainMod, S, togglespecialworkspace,
