theme = "penguin"

[editor]
line-number = "relative"
scrolloff = 999
popup-border = "all"
auto-format = false
end-of-line-diagnostics = "disable"
completion-timeout = 1
preview-completion-insert = false

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.statusline]
left = ["mode"]
center = []
right = []
mode.normal = "🐧 N"
mode.insert = "🐧 I"
mode.select = "🐧 S"

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[keys.normal]
C-s = [":fmt", ":write"]                             # format save
C-A-s = "save_selection"
space = { space = "file_picker", q = { q = ":qa" } }

C-p = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi $easifem --chooser-file=/tmp/unique-file',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]

# see https://yazi-rs.github.io/docs/tips/#helix-with-tmux
A-y = ":sh tmux new-window -n fx '~/.config/helix/yazi-picker.sh open'"
C-y = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/unique-file',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]

# textobjects related 
"]" = { f = [
  "goto_next_function",
  "flip_selections",
], t = [
  "goto_next_class",
  "flip_selections",
], d = [
  "goto_next_entry",
  "flip_selections",
], c = [
  "goto_next_comment",
  "flip_selections",
], a = [
  "goto_next_parameter",
  "flip_selections",
] }

"-" = { f = [
  "goto_next_function",
  "flip_selections",
], t = [
  "goto_next_class",
  "flip_selections",
], d = [
  "goto_next_entry",
  "flip_selections",
], c = [
  "goto_next_comment",
  "flip_selections",
], a = [
  "goto_next_parameter",
  "flip_selections",
], "-" = { f = "@maf", t = "@mat", d = "@mae", c = "@mac", a = "@maa" } }
# "[" = { f = ["goto_prev_function", "collapse_selection"] }

[keys.insert.j]
k = "normal_mode"
