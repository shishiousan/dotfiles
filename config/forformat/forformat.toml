mode = "full"
line_length = 78
indent = 2
indent_module = 0
indent_case = 2
indent_mod = false
keyword_case = "upper"
openmp_case = true
relational_symbols = false
array_brackets = false
split_compound_keywords = true
join_goto = false
strip_empty_args = false
remove_redundant_parens = false
normalize_semicolons = false
remove_terminal_return = false
program_unit_spacing = false
max_blank_lines = 1
compact_multiplicative = false
align_declarations = true
align_comments = true
reduce_whitespace = true
comment_spacing = false
align_paren = false
defines = ["DEBUG_VER"]
